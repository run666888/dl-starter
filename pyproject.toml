[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dl-starter"
version = "0.2.0"
description = "A practical image-classification training project with Intel XPU support"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.11",
  "torchvision>=0.26",
]

[tool.setuptools.packages.find]
where = ["src"]

